  화면 id      : s-ebr-interlock-rule-ui  (EBR 모듈 · S-48 인터록 규칙 마스터 + 검토 · 승인 서명 팝업 #dlgIlrApprove + 버전 비교 팝업 #dlgIlrDiff)
  클래스       : CEbrSetupInterlockRuleMain (T-02 변형: 세트 바 + 목록 + 상세 폼)
  설계         : poc-interlock-rule-design.md §5 (W1 · W2 · W3 · W5) · poc-interlock-rule-ui-items.md IR-01 · IR-02 · IR-03
  연결         : ../../ilr-ui-wire.js — IlApi (EbrInterlock · MS.ilr* 가 없으면 fail-closed, 화면은 연결 지점 1곳만 호출)

                 세트 바 높이 94 확정 (:root --ilr-setbar-h)
  URL          : ?ruleId=IL-…(&ro=1) 그 행 선택 + 읽기 전용 · ?set=ILR-STD&ver=8 세트 선택
-->

<style>
  /* 세트 바 높이 94 확정 (조회 행 2 × 40 + 여백 14) */
  :root { --ilr-setbar-h: calc(var(--search-row-h) * 2 + var(--title-gap) + var(--split-gutter)); }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--c-bg); }
  body.fit-host { display: flex; align-items: flex-start; justify-content: flex-start; }
  #shellScale.shell-scale { flex: 0 0 auto; }
     - 그래도 넘치는 입력값은 한 줄 말줄임 + title(전체 값) — 스크롤 없음 */
  #dlgMaster input.input[type=text] { text-overflow: ellipsis; }
  /* ==== P0 UI-04 현재 사용자 선택기 · 역할 배지 (공통 블록 — 기준정보 화면 + 배치 발행 동일) ====
     위치: .title-bar 안 .breadcrumb 바로 앞, margin-left:auto (DESIGN §11-3 grpTitle: title │ 1fr │ 브레드크럼)
     역할 배지 매핑: ui-items UI-04 (승인 P5) — 기존 .badge 변형 + --bc-* 토큰만, 라벨 항상 표시 */
  .title-bar > .user-switch { margin-left: auto; display: inline-flex; align-items: center; gap: calc(var(--badge-gap) * 1.5); min-width: 0; white-space: nowrap; }
  .title-bar > .user-switch .tip { display: inline-flex; }
  .title-bar > .user-switch select.input { height: var(--ctrl-h-form); }   /* UI-04: 24 (--title-h 29 안) — 키인 폼 컨트롤 높이 토큰 */
  .user-switch .us-roles { display: inline-flex; align-items: center; gap: var(--badge-gap); min-width: 0; }
  .badge.role-qa { background: var(--bc-quality); } .badge.role-qa::before { background: var(--c-primary); }
  .badge.role-qp { background: var(--bc-offpump); } .badge.role-qp::before { background: var(--c-navy); }
  /* 선택 없음: 편집·서명 버튼 비활성 표시 (opacity = §13-1 disabled) + 툴팁 "사용자를 선택하세요" (클릭은 스크립트가 차단) */
  body.p0-no-user .p0-gated { opacity: .4; cursor: not-allowed; }

  /* ---- S-48 본문 ---- */
  .ilr-setbar { flex: 0 0 auto; height: var(--ilr-setbar-h); box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; padding: 0 var(--title-gap);
                border-top: thin solid var(--c-border-01); border-bottom: thin solid var(--c-border-03); }
  .ilr-setbar .sb-row { flex: 1 1 0; display: flex; align-items: center; gap: var(--title-gap); min-width: 0; }
  .ilr-setbar .sb-row + .sb-row { border-top: thin solid var(--c-border-05); }
  .ilr-setbar .label { white-space: nowrap; }
  .ilr-setbar select.input, .ilr-setbar input.input { height: var(--ctrl-h-form); }
  .ilr-setbar #ilrSet { width: var(--col-w-240); }
  .ilr-setbar .sb-sel { width: var(--col-w-160); }
  .ilr-setbar .sub-info { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .ilr-setbar .spacer { flex: 1 1 auto; }
  #ilrGridBlock { flex: 1 1 auto; min-height: 0; }
  #ilrGridBlock .grid-wrap { overflow: hidden; }
  #grdIlr td { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #grdIlr col.c-id { width: var(--col-w-240); } #grdIlr col.c-160 { width: var(--col-w-160); } #grdIlr col.c-200 { width: var(--col-w-200); }
  #grdIlr tr.locked td { color: var(--c-text-sub); background: var(--bc-gray-light); }
  #grdIlr tr.disabled-rule td { color: var(--c-text-disabled); }
  #grdIlr td .badge + .badge { margin-left: var(--badge-gap); }
  .ilr-pager { display: inline-flex; align-items: center; gap: var(--badge-gap); }
  #ilrDetail { flex: 0 0 auto; height: calc(var(--toolbar-h) * 2 + var(--form-row-h) * 4 + var(--title-gap) * 3 + var(--badge-gap)); display: flex; flex-direction: column; gap: var(--title-gap); min-height: 0; }

  #ilrDetail .dt-btns { flex: 0 0 auto; height: var(--toolbar-h); display: flex; align-items: center; gap: var(--split-gutter); min-width: 0; }

  #grdIaChg col.c-f, #grdIlrDiff col.c-f { width: var(--col-w-short); } #grdIlrDiff col.c-a { width: var(--col-w-240); }

<!-- ==== P0 UI-04 현재 사용자 선택기 · 역할 배지 — EbrUserSession(UI-09) 어댑터 (공통 블록, 기준정보 화면 + 배치 발행 동일) ==== -->
<script>
/* 공개 API (UI-09 ebr-user-session.js, window.EbrUserSession) — 화면 → 헬퍼 호출은 이 블록 + 화면별 어댑터 구역만.
 *   listUsers({q,role,status}) · getCurrentUser() · setCurrentUser(id|null) → {ok,user}|{ok:false,code} · rolesOf(id)
 *   hasSodConflict(roles) · onChange(fn) → unsub
 * 헬퍼는 마크업을 만들지 않는다 → 선택기 · 배지는 이 블록이 그린다 (ui-items UI-04).
 * 헬퍼가 없으면(파일 미배포) 선택기는 「사용자 API 미연결」로 비활성 표시만 하고 화면 기존 동작은 그대로 둔다(게이트 미적용, 오류 없음). */
(function (global) {
  'use strict';
  var WATCH_KEYS = ['ebmr.currentUser.v1', 'ebmr.userRole.v1'];   /* onChange 가 없을 때만: 다른 탭 변경 감지용 키 이름 (값은 헬퍼로만 읽음) */
  var ROLE = { QP: ['QP', 'role-qp'], QA: ['QA', 'role-qa'], SV: ['감독자', 'ok'], OP: ['작업자', 'info'], ADMIN: ['관리자', ''] };
  var ROLE_ORDER = ['QP', 'QA', 'SV', 'OP', 'ADMIN'];   /* 배지 우선순위 QP>QA>SV>OP>ADMIN (기획 마스터 §3.1) */
  var GATE_SEL = '[data-p0-edit],[data-act="new"],[data-act="delete"],[data-act="submit"],[data-act="approve"],[data-act="activate"],[data-act="reject"],[data-act="retire"],#dmSave,#dmNewVer';
  var GATE_TIP = '사용자를 선택하세요';
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var listeners = [], readyQ = [], isReady = false;

  function api() { return global.EbrUserSession || null; }
  function call(fn) {
    var a = api(); if (!a || typeof a[fn] !== 'function') return undefined;
    try { return a[fn].apply(a, Array.prototype.slice.call(arguments, 1)); } catch (e) { if (global.console) console.error('[EbrUserSession] ' + fn, e); return undefined; }
  }
  function sortRoles(roles) { return (roles || []).slice().sort(function (a, b) { return ROLE_ORDER.indexOf(a) - ROLE_ORDER.indexOf(b); }); }
  function roleBadge(code) { var r = ROLE[code] || [code, 'muted']; return '<span class="badge' + (r[1] ? ' ' + r[1] : '') + '" title="' + esc(code) + '">' + esc(r[0]) + '</span>'; }
  function roleBadges(roles) { return sortRoles(roles).map(roleBadge).join(''); }
  function statusBadge(st) { return st === 'locked' ? '<span class="badge error">잠김</span>' : st === 'inactive' ? '<span class="badge muted">비활성</span>' : ''; }
  function rolesOfUser(u) { return !u ? [] : (Array.isArray(u.roles) ? u.roles : (call('rolesOf', u.userId) || [])); }
  function users(filter) { var l = call('listUsers', filter || {}); return Array.isArray(l) ? l : []; }
  function current() { return call('getCurrentUser') || null; }

    var s = st.set, ed = editable(), rv = s && s.status === 'review';
    ['btnIlrAdd', 'btnIlrSave'].forEach(function (id) { $(id).disabled = !ed; });
    $('btnIlrReview').disabled = !ed;
    $('btnIlrNewVer').disabled = !can('edit') || !s || s.scope === 'demo' || IlApi.sets().some(function (x) { return x.id === s.id && (x.status === 'draft' || x.status === 'review'); });
    var kind = rv && !s.reviewer ? 'review' : 'approve', ok = rv && (kind === 'review' ? can('review') : can('approve'));
    $('btnIlrSign').textContent = kind === 'review' ? '검토 서명 ›' : '승인 서명 ›'; $('btnIlrSign').dataset.kind = kind; $('btnIlrSign').disabled = !ok;
    $('btnIlrSignWrap').title = ok ? '' : RO_LINK ? '읽기 전용 (링크로 열림)' : !rv ? '검토 요청 상태에서 서명합니다' : kind === 'review' ? '검토 = SV · QA' : '승인 = QA';
    if (!$('dtMsg').classList.contains('sign-err')) showErr(null);
  }

  /* ---------------- 이벤트 ---------------- */
  $('ilrSet').addEventListener('change', pickSet);
  $('btnIlrSearch').addEventListener('click', function () { st.page = 0; renderList(); });
  ['fltPoint', 'fltGrade', 'fltInactive'].forEach(function (id) { $(id).addEventListener('change', function () { st.page = 0; renderList(); }); });
  $('pgPrev').addEventListener('click', function () { st.page--; renderList(); });
  $('pgNext').addEventListener('click', function () { st.page++; renderList(); });
  $('grdIlrBody').addEventListener('click', function (e) { var tr = e.target.closest('tr[data-i]'); if (!tr) return; collect(); st.sel = +tr.dataset.i; showErr(null); renderList(); renderDetail(); });
  $('dtForm').addEventListener('change', function (e) { collect(); if (e.target.dataset.f === 'type' || e.target.dataset.f === 'grade') renderDetail(); renderList(); });
  $('dtRuleId').addEventListener('change', function () { collect(); renderList(); });
  $('btnIlrAdd').addEventListener('click', function () {
    collect(); var n = 1; while (st.rules.some(function (r) { return r.ruleId === 'IL-NEW-' + n; })) n++;
    st.rules.push({ ruleId: 'IL-NEW-' + n, name: '새 규칙', point: 'pack.reconcile', cond: { type: 'range', field: 'yieldPct', lo: '', hi: '', unit: '%' }, grade: 'Warning', msg: '', actions: [], sopRef: '', floor: null, locked: false, enabled: true, legacyRef: '' });
    st.sel = st.rules.length - 1; st.page = Math.floor(st.sel / ROWS); st.dirty = true; renderList(); renderDetail();
  });
  $('btnIlrSave').addEventListener('click', function () {
    collect(); var r = IlApi.saveDraft(st.set.id, st.set.ver, st.rules);
    if (!r || !r.ok) { showErr(r); return; }
    var k = st.setKey, sel = st.sel; loadSets(k); st.sel = sel; renderList(); renderDetail(); showErr(null); toast('저장 (draft) — hash ' + r.hash, 'ok');
  });
  $('btnIlrReview').addEventListener('click', function () {
    collect(); if (st.dirty) { var sv = IlApi.saveDraft(st.set.id, st.set.ver, st.rules); if (!sv || !sv.ok) { showErr(sv); return; } }
    var r = IlApi.requestReview(st.set.id, st.set.ver); if (!r || !r.ok) { showErr(r); return; }
    loadSets(st.setKey); toast('검토 요청 — ' + st.set.id + ' v' + st.set.ver, 'ok');
  });
  $('btnIlrNewVer').addEventListener('click', function () {
    var r = IlApi.newVersion(st.set.id); if (!r || !r.ok) { showErr(r); return; }
    loadSets(setKey(r.set)); toast('새 버전 v' + r.set.ver + ' (draft) — 효력 v' + (r.set.ver - 1) + ' 복제', 'ok');
  });
  $('btnIlrDiff').addEventListener('click', openDiff);
  $('btnIlrSign').addEventListener('click', function () { openSign(this.dataset.kind); });

  /* ---------------- IR-03 버전 비교 ---------------- */
  function openDiff() {
    var a = diffBase(), b = st.set; if (!a || !b) return;
    var d = IlApi.diff({ id: a.id, ver: a.ver }, { id: b.id, ver: b.ver });
    $('idTitle').textContent = '버전 비교 — ' + b.id + ' v' + a.ver + ' › v' + b.ver; $('idThA').textContent = 'v' + a.ver; $('idThB').textContent = 'v' + b.ver;
    var c = { add: 0, chg: 0, same: 0, del: 0 }; d.forEach(function (x) { c[x.kind]++; });
    $('idTotal').textContent = '추가 ' + c.add + ' · 변경 ' + c.chg + ' · 같음 ' + c.same + (c.del ? ' · 삭제 ' + c.del : '');
    function draw() {
      var all = $('idSame').checked, ch = d.filter(function (x) { return x.kind !== 'same'; }), same = d.filter(function (x) { return x.kind === 'same'; });
      var K = { add: ['추가', 'ok'], chg: ['변경', 'warn'], del: ['삭제', 'error'], same: ['같음', ''] };
      var row = function (x) { return '<tr class="' + (x.kind === 'same' ? 'same' : '') + '"><td><span class="badge ' + K[x.kind][1] + '">' + K[x.kind][0] + '</span></td><td title="' + esc(x.ruleId + ' · ' + x.grade) + '">' + esc(x.ruleId) + ' · ' + esc(x.grade) + '</td><td>' + esc(x.field) + '</td><td title="' + esc(x.a) + '">' + esc(x.a) + '</td><td title="' + esc(x.b) + '">' + esc(x.b) + '</td></tr>'; };
      $('grdIlrDiffBody').innerHTML = ch.map(row).join('') + (all ? same.map(row).join('') : same.length ? '<tr class="same"><td><span class="badge">같음</span></td><td colspan="4" class="sub-info">(나머지 규칙 ' + same.length + '건 — 접힘)</td></tr>' : '');
      $('idWrap').classList.toggle('scroll', all);
    }
    $('idSame').checked = false; $('idSame').onchange = draw; draw();
    MesUI.openDialog('dlgIlrDiff');
  }
  $('btnIdPrint').addEventListener('click', function () { window.print(); });

  /* ---------------- IR-02 검토 · 승인 서명 (#dlgRecSign 틀) ---------------- */
  var sg = null;
  function openSign(kind) {
    var s = st.set; if (!s) return;
    var r = IlApi.beginSetSign({ setId: s.id, ver: s.ver, kind: kind });
    if (!r || !r.ok) { showErr(r); toast(r && r.message || IlApi.whyText((r && r.why) || 'ilr_store_error'), 'error'); return; }
    var t = r.target, ap = kind === 'approve', u = P0Ui.current(), ch = t.changes || [];
    sg = { ticket: r.ticket, kind: kind, done: false };
    $('iaDot').className = 'sign-meaning ' + (ap ? 'approved' : 'reviewed');
    $('iaTitle').textContent = '전자서명 — 인터록 룰 세트 ' + (ap ? '승인 (Approved by)' : '검토 (Reviewed by)');
    $('iaF1').textContent = s.id + (t.from ? ' v' + t.from + ' › v' + s.ver : ' v' + s.ver) + ' · hash ' + t.hash; $('iaF1').title = $('iaF1').textContent;
    $('iaF2').textContent = '작성 ' + (t.author || '—') + ' · 검토 ' + (t.reviewer || (ap ? '—' : '이번 서명'));
    $('iaF3').textContent = t.rule.id + ' v' + t.rule.ver + ' · 허용 ' + t.rule.roles.join(' · ');
    $('iaF4').textContent = u ? u.name + ' (' + u.userId + ')' : '—';
    $('iaEff').textContent = ap ? '승인 후 효력일 ' + effDate() + ' 00:00 (KST)부터 신규 발행 배치에 적용. 이미 발행된 배치는 발행 때 고정한 v' + (t.from || '—') + ' 을 계속 씁니다.' : '검토 서명 후 QA 승인 서명이 있어야 효력이 생깁니다. 효력 전에는 발행 배치에 적용되지 않습니다.';
    $('iaThA').textContent = t.from ? 'v' + t.from : '이전'; $('iaThB').textContent = 'v' + s.ver;
    var K = { add: ['추가', 'ok'], chg: ['변경', 'warn'], del: ['삭제', 'error'] };
    var shown = ch.length > 9 ? ch.slice(0, 8) : ch;
    $('grdIaChgBody').innerHTML = shown.map(function (x) { return '<tr><td title="' + esc(x.ruleId) + '">' + esc(x.ruleId) + ' · ' + esc(x.grade) + '</td><td><span class="badge ' + K[x.kind][1] + '">' + K[x.kind][0] + '</span></td><td>' + esc(x.field) + '</td><td title="' + esc(x.a) + '">' + esc(x.a) + '</td><td title="' + esc(x.b) + '">' + esc(x.b) + '</td></tr>'; }).join('') +
      (ch.length > 9 ? '<tr><td colspan="5" class="sub-info">… 외 ' + (ch.length - 8) + '건 — 비교 창</td></tr>' : '') + (ch.length ? '' : '<tr><td colspan="5" class="sub-info">변경 없음</td></tr>');
    $('iaChgTitle').textContent = '변경 요약 (v' + (t.from || '—') + ' 대비)';
    $('iaChgNote').textContent = '변경 ' + ch.length + ' · 하한 위반 0';
    $('iaUser').innerHTML = u ? '<span class="name">' + esc(u.name) + '</span><span class="sub-info">' + esc(u.userId) + '</span><span class="badges">' + P0Ui.roleBadges(P0Ui.rolesOf(u)) + '</span>' : '<span class="sub-info">현재 사용자 없음</span>';
    $('iaRule').textContent = t.rule.id + ' v' + t.rule.ver + ' · ' + (ap ? '승인' : '검토') + ' · 허용 ' + t.rule.roles.join(' · ') + ' · 동일인 차단: 작성자' + (ap ? ' · 검토자' : '');
    $('iaRule').title = $('iaRule').textContent;
    $('iaQual').textContent = '요구 자격: ' + (IlApi.SIGN_RULES[t.rule.id] ? IlApi.SIGN_RULES[t.rule.id].qual : '—');
    $('iaStmt').textContent = t.statement;
    $('iaNote').textContent = 'kind ' + t.statementKind + ' · recType ' + t.recordType;
    $('iaId').value = u ? u.userId : ''; $('iaPw').value = ''; $('iaErr').textContent = '';
    $('btnIaSign').textContent = ap ? '승인 서명' : '검토 서명'; inp();
    MesUI.openDialog('dlgIlrApprove'); setTimeout(function () { $('iaPw').focus(); }, 0);
  }
  function effDate() { var d = new Date(); d.setDate(d.getDate() + 1); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function inp() { $('btnIaSign').disabled = !($('iaId').value.trim() && $('iaPw').value); }
  ['iaId', 'iaPw'].forEach(function (id) { $(id).addEventListener('input', inp); });
  $('iaPw').addEventListener('keydown', function (e) { if (e.key === 'Enter' && !$('btnIaSign').disabled) doSign(); });
  $('btnIaSign').addEventListener('click', doSign);
  function doSign() {
    if (!sg) return;
    var r = IlApi.commitSetSign(sg.ticket, { userId: $('iaId').value.trim(), password: $('iaPw').value, statement: $('iaStmt').textContent });
    $('iaPw').value = ''; inp();
    if (!r || !r.ok) { $('iaErr').textContent = (r && r.message) || IlApi.whyText((r && r.why) || 'unknown'); $('iaErr').title = $('iaErr').textContent; return; }
    sg.done = true; var k = sg.kind; MesUI.closeDialog('dlgIlrApprove');
    toast((k === 'approve' ? '승인 서명 완료 — 효력일 ' + effDate() : '검토 서명 완료') + ' · ' + (r.signatureId || ''), 'ok');
    loadSets(st.setKey);
  }
  $('dlgIlrApprove').addEventListener('dialogclose', function () { if (sg && !sg.done) IlApi.cancelSign(sg.ticket); sg = null; });

  /* ---------------- 시작 ---------------- */
  MS.load(); if (window.MT && MT.shell) MT.shell('ilr');
  $('btnCopyLink').addEventListener('click', function () { if (navigator.clipboard) navigator.clipboard.writeText(location.href); toast('화면 링크를 복사했습니다.', 'ok'); });
  filterOpts();
  P0Ui.ready(function () { loadSets(); P0Ui.onUserChange(function () { renderList(); renderDetail(); }); });
  window.__ilr = { st: st, reload: function () { loadSets(st.setKey); } };
})();

  /* ---- viewport fit (catalog iframe + <1920 window) ---- */
  function fitShellToViewport() {
    var wrap = document.getElementById('shellScale');
    if (!wrap) return;
    var sw = 1920, sh = 1080;
    var w = window.innerWidth || sw;
    var h = window.innerHeight || sh;
    try {
      if (window.frameElement) {
        var fr = window.frameElement.getBoundingClientRect();
        if (fr.width > 40) w = fr.width;
        if (fr.height > 40) h = fr.height;
      }
    } catch (err) { /* cross-origin: keep innerWidth */ }
    if (window.visualViewport) {
      if (window.visualViewport.width > 40) w = Math.min(w, window.visualViewport.width);
      if (window.visualViewport.height > 40) h = Math.min(h, window.visualViewport.height);
    }
    var s = Math.min(w / sw, h / sh, 1);
    if (!(s > 0) || !isFinite(s)) s = 1;
    wrap.style.setProperty('--scale', String(s));
    wrap.style.width = (sw * s) + 'px';
    wrap.style.height = (sh * s) + 'px';
    document.body.classList.add('fit-host');
    document.documentElement.style.overflow = 'hidden';
    document.body.style.overflow = 'hidden';
  }
  window.addEventListener('resize', fitShellToViewport);
  window.addEventListener('load', fitShellToViewport);
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', fitShellToViewport);
  }
  fitShellToViewport();
  setTimeout(fitShellToViewport, 0);
  setTimeout(fitShellToViewport, 120);
</script>
