<!-- ==== P0 UI-04 현재 사용자 선택기 · 역할 배지 — EbrUserSession(UI-09) 어댑터 (공통 블록, 기준정보 화면 + 배치 발행 동일) ==== -->
<script>
/* DEVELOPER1 공개 API (UI-09 ebr-user-session.js, window.EbrUserSession) — 화면 → 헬퍼 호출은 이 블록 + 화면별 어댑터 구역만.
 *   listUsers({q,role,status}) · getCurrentUser() · setCurrentUser(id|null) → {ok,user}|{ok:false,code} · rolesOf(id)
 *   hasSodConflict(roles) · onChange(fn) → unsub
 * 헬퍼는 마크업을 만들지 않는다 → 선택기 · 배지는 이 블록이 그린다 (ui-items UI-04).
 * 헬퍼가 없으면(파일 미배포) 선택기는 「사용자 API 미연결」로 비활성 표시만 하고 화면 기존 동작은 그대로 둔다(게이트 미적용, 오류 없음). */
(function (global) {
  'use strict';
  var WATCH_KEYS = ['ebmr.currentUser.v1', 'ebmr.userRole.v1'];   /* onChange 가 없을 때만: 다른 탭 변경 감지용 키 이름 (값은 헬퍼로만 읽음) */
  var ROLE = { QP: ['QP', 'role-qp'], QA: ['QA', 'role-qa'], SV: ['감독자', 'ok'], OP: ['작업자', 'info'], ADMIN: ['관리자', ''] };
  var ROLE_ORDER = ['QP', 'QA', 'SV', 'OP', 'ADMIN'];   /* 배지 우선순위 QP>QA>SV>OP>ADMIN (기획 마스터 §3.1) */
  var GATE_SEL = '[data-p0-edit],[data-act="new"],[data-act="delete"],[data-act="submit"],[data-act="approve"],[data-act="activate"],[data-act="reject"],[data-act="retire"],#dmSave,#dmNewVer';
  var GATE_TIP = '사용자를 선택하세요';
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var listeners = [], readyQ = [], isReady = false;

  function api() { return global.EbrUserSession || null; }
  function call(fn) {
    var a = api(); if (!a || typeof a[fn] !== 'function') return undefined;
    try { return a[fn].apply(a, Array.prototype.slice.call(arguments, 1)); } catch (e) { if (global.console) console.error('[EbrUserSession] ' + fn, e); return undefined; }
  }
  function sortRoles(roles) { return (roles || []).slice().sort(function (a, b) { return ROLE_ORDER.indexOf(a) - ROLE_ORDER.indexOf(b); }); }
  function roleBadge(code) { var r = ROLE[code] || [code, 'muted']; return '<span class="badge' + (r[1] ? ' ' + r[1] : '') + '" title="' + esc(code) + '">' + esc(r[0]) + '</span>'; }
  function roleBadges(roles) { return sortRoles(roles).map(roleBadge).join(''); }
  function statusBadge(st) { return st === 'locked' ? '<span class="badge error">잠김</span>' : st === 'inactive' ? '<span class="badge muted">비활성</span>' : ''; }
  function rolesOfUser(u) { return !u ? [] : (Array.isArray(u.roles) ? u.roles : (call('rolesOf', u.userId) || [])); }
  function users(filter) { var l = call('listUsers', filter || {}); return Array.isArray(l) ? l : []; }
  function current() { return call('getCurrentUser') || null; }
  function connected() { var a = api(); return !!(a && typeof a.getCurrentUser === 'function' && typeof a.listUsers === 'function'); }
  function hasRole(u, code) { return rolesOfUser(u).indexOf(code) >= 0; }
  function sod(roles) { var v = call('hasSodConflict', roles || []); return typeof v === 'boolean' ? v : false; }
  function gateOn() { return connected() && !current(); }
  function userLabel(u) { return u ? u.name + ' (' + u.userId + ')' : '—'; }

  function render() {
    var host = document.getElementById('userSwitch');
    if (host) {
      if (!connected()) {
        host.innerHTML = '<span class="tip" title="ebr-user-session.js (DEVELOPER1) 가 로드되면 선택할 수 있습니다"><select class="input w-200" disabled aria-label="현재 사용자"><option>사용자 API 미연결</option></select></span>';
      } else {
        var cur = current(), list = users();
        var opts = '<option value="">사용자 선택</option>' + list.map(function (u) {
          var bad = u.status === 'locked' ? ' — 잠김' : u.status === 'inactive' ? ' — 비활성' : '';
          return '<option value="' + esc(u.userId) + '"' + (bad ? ' disabled' : '') + (cur && cur.userId === u.userId ? ' selected' : '') + '>' + esc(userLabel(u) + bad) + '</option>';
        }).join('');
        host.innerHTML = '<select class="input w-200" id="userSwitchSel" aria-label="현재 사용자" title="현재 사용자 (인증 아님 — 서명 시 ID · 비밀번호 재입력)">' + opts + '</select>' +
          '<span class="us-roles">' + (cur ? roleBadges(rolesOfUser(cur)) + statusBadge(cur.status) : '<span class="badge warn">' + GATE_TIP + '</span>') + '</span>';
        var sel = document.getElementById('userSwitchSel');
        sel.addEventListener('change', function () {
          var r = call('setCurrentUser', sel.value || null);
          if (r && r.ok === false && global.MesUI) {
            MesUI.toast(r.message || (r.code === 'LOCKED' ? '잠긴 계정은 선택할 수 없습니다 — 관리자(ADMIN)에게 해제를 요청하세요.'
              : r.code === 'INACTIVE' ? '비활성 계정은 선택할 수 없습니다.' : r.code === 'SAVE_ERROR' ? '감사 기록을 저장하지 못해 사용자를 전환하지 못했습니다.' : '사용자를 찾을 수 없습니다.'),
              r.code === 'SAVE_ERROR' ? 'error' : 'warn', 2600);   /* SAVE_ERROR: 헬퍼가 변경을 되돌림 → 선택값도 아래 refresh 로 되돌림 */
          }
          if (!hasOnChange || (r && r.ok === false)) refresh();   /* onChange 는 성공 시 헬퍼가 발생 — 거부(LOCKED 등)면 선택 되돌림 */
        });
      }
    }
    applyGate();
  }
  function applyGate() {
    var on = gateOn();
    document.body.classList.toggle('p0-no-user', on);
    Array.prototype.forEach.call(document.querySelectorAll(GATE_SEL), function (b) { b.classList.toggle('p0-gated', on); });
  }
  function refresh() { render(); listeners.forEach(function (fn) { try { fn(current()); } catch (e) { if (global.console) console.error(e); } }); }

  /* 선택 없음 게이트: 편집 버튼 클릭 차단 + 툴팁 (동적으로 그려지는 T-02 버튼 포함) */
  document.addEventListener('click', function (e) {
    if (!gateOn()) return;
    var b = e.target.closest && e.target.closest(GATE_SEL);
    if (!b) return;
    e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
    if (global.MesUI) MesUI.toast(GATE_TIP + ' — 상단 사용자 선택기에서 현재 사용자를 고른 뒤 다시 시도하세요.', 'warn', 2200);
  }, true);
  document.addEventListener('mouseover', function (e) {
    var b = e.target.closest && e.target.closest(GATE_SEL);
    if (!b) return;
    if (gateOn()) { if (!b.hasAttribute('data-p0-tip')) b.setAttribute('data-p0-tip', b.getAttribute('title') || ''); b.setAttribute('title', GATE_TIP); b.classList.add('p0-gated'); }
    else if (b.hasAttribute('data-p0-tip')) { b.setAttribute('title', b.getAttribute('data-p0-tip')); b.removeAttribute('data-p0-tip'); b.classList.remove('p0-gated'); }
  }, true);

  var hasOnChange = false;
  function start() {
    isReady = true;
    var a = api();
    if (a && typeof a.onChange === 'function') { hasOnChange = true; call('onChange', function () { refresh(); }); }
    else global.addEventListener('storage', function (e) { if (WATCH_KEYS.indexOf(e.key) >= 0) refresh(); });
    render();
    readyQ.splice(0).forEach(function (fn) { try { fn(); } catch (e) { if (global.console) console.error(e); } });
  }

  global.P0Ui = {
    api: api, call: call, connected: connected, users: users, current: current, hasRole: hasRole, rolesOf: rolesOfUser, sod: sod, userLabel: userLabel,
    roleBadge: roleBadge, roleBadges: roleBadges, statusBadge: statusBadge, sortRoles: sortRoles, ROLE: ROLE, ROLE_ORDER: ROLE_ORDER,
    gateOn: gateOn, refresh: refresh, applyGate: applyGate, esc: esc, GATE_TIP: GATE_TIP,
    onUserChange: function (fn) { listeners.push(fn); },
    ready: function (fn) { if (isReady) fn(); else readyQ.push(fn); }
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})(window);
</script>
<script src="../assets/master-t02.js"></script>
<script>
(function () {
  'use strict';
  var $ = MS.$, $$ = MS.$$, esc = MS.esc, O = MS.OPTS;
  MS.load();
  MT.shell('sign');
  /* ==== P0 UI-07 허용 역할 (allowedRoles) — 화면 표시 · 편집 ====
     검증: EbrUserSession.validateAllowedRoles(arr) → null | 문구 (UI-09, DEVELOPER1). 헬퍼 미로드 시에만 같은 규칙(기획 마스터 §4.1)으로 화면 검사.
     시드(SM-APPR-ISSUE = SV · QA) · REC batch_issue · fail-closed 판정은 DEVELOPER1 (UI-07, 확정 P3). 옵션은 UI-07 표 고정 5종. */
  var ROLE_OPTS = [{ v: 'OP', t: '작업자 (OP)' }, { v: 'SV', t: '감독자 (SV)' }, { v: 'QA', t: 'QA' }, { v: 'QP', t: 'QP' }, { v: 'ADMIN', t: '관리자 (ADMIN)' }];
  function allowedRolesCell(r) {
    var a = r.allowedRoles;
    if (!Array.isArray(a) || !a.length) return '<span class="badge warn" title="발행 승인 등 이 열을 읽는 서명은 거부됩니다(fail-closed)">미설정</span>';
    /* F-06: 한 줄 말줄임(.ar-cell) + 셀 title = 역할 라벨 ' · ' 연결 (예 "QA · 감독자 · 작업자").
       셀 title 은 master-t02 가 셀 HTML 의 태그를 지운 글자로 만들므로, 화면에 안 보이는 구분자(.ar-sep)를 끼워 그 글자가 라벨 목록이 되게 한다.
       배지 개별 title 은 두지 않음(셀 title 을 가리지 않도록) */
    if (!window.P0Ui) return '<span class="ar-cell">' + esc(a.join(' · ')) + '</span>';
    return '<span class="ar-cell">' + P0Ui.sortRoles(a).map(function (c) {
      var x = P0Ui.ROLE[c] || [c, 'muted'];
      return '<span class="badge' + (x[1] ? ' ' + x[1] : '') + '">' + esc(x[0]) + '</span>';
    }).join('<span class="ar-sep" aria-hidden="true"> · </span>') + '</span>';
  }
  function validateAllowedRoles(a) {
    var api = window.EbrUserSession;
    if (api && typeof api.validateAllowedRoles === 'function') return api.validateAllowedRoles(a || []) || '';
    if (!Array.isArray(a) || !a.length) return '허용 역할을 1개 이상 선택하세요.';
    if (a.indexOf('ADMIN') >= 0) return '관리자(ADMIN)는 GMP 서명 역할이 아닙니다 — 허용 역할에서 빼세요.';
    return '';
  }
  function signMeaningCell(code) { var r = MS.gRow('EBR_SIGN_MEANING', code); return r ? '<span class="swatch" style="background:' + esc(r.data1) + '"></span>' + esc(r.keyDesc) : esc(code); }

  var SIGN = {
    key: 'sign', store: 'sign', sid: 'S-39', clazz: 'CEbrSetupSignatureMeaningMain', title: '서명 의미', group: '서명 의미 코드 (의미 × 적용 레코드 타입)', dialogW: 700, formCols: 1,
    gcm: [['EBR_SIGN_MEANING', '서명 의미 · 색'], ['EBR_AUTH_STRENGTH', '요구 인증 강도'], ['EBR_MBR_STATUS', '상태']],
    note: '확인 · 승인은 항상 전 요소(ES-03), 연속 세션 PIN 은 수행 서명만. 서명 의미 색은 GCM EBR_SIGN_MEANING.data1 을 S-27 서명 팝업이 그대로 사용합니다.',
    search: [{ t: 'text', label: '서명 코드 · 비고', keys: ['id', 'note'] }, { t: 'select', label: '서명 의미', k: 'meaning', src: 'gcm:EBR_SIGN_MEANING' }, { t: 'select', label: '레코드 타입', k: 'recType', src: O.REC },
      { t: 'select', label: '인증 강도', k: 'auth', src: 'gcm:EBR_AUTH_STRENGTH' }, { t: 'select', label: '상태', k: 'status', src: 'gcm:EBR_MBR_STATUS' }],
    cols: [{ h: '서명 코드', k: 'id', w: 140 }, { h: '버전', k: 'ver', w: 56 }, { h: '서명 의미', k: 'meaning', w: 130, r: function (r) { return signMeaningCell(r.meaning); } },
      { h: '영문 의미', k: 'meaning', w: 140, r: function (r) { var g = MS.gRow('EBR_SIGN_MEANING', r.meaning); return esc(g ? g.data2 : ''); } },
      { h: '적용 레코드 타입', k: 'recType', w: 150, src: O.REC }, { h: '요구 인증 강도', k: 'auth', w: 120, src: 'gcm:EBR_AUTH_STRENGTH' },
      { h: '일괄 허용', k: 'batch', w: 76, cls: 'center', r: function (r) { return MS.yn(r.batch); } }, { h: '동일인 차단', k: 'samePerson', w: 84, cls: 'center', r: function (r) { return MS.yn(r.samePerson); } },
      { h: '허용 역할', k: 'allowedRoles', w: 150, r: allowedRolesCell },
      { h: '상태', k: 'status', w: 96, cls: 'center' }, { h: '콘텐츠 해시', k: 'hash', w: 100 }, { h: '수정일', k: 'upd', w: 96 }, { h: '비고', k: 'note' }],
    form: [{ k: 'id', label: '서명 코드', type: 'text', req: true, lockOnEdit: true, ph: 'SM-XXXX-XXXX' }, { k: 'meaning', label: '서명 의미', type: 'select', src: 'gcm:EBR_SIGN_MEANING', req: true },
      { k: 'color', label: '표시 색 (GCM)', type: 'display', render: function (d) { var g = MS.gRow('EBR_SIGN_MEANING', d.meaning); return g ? '<span class="swatch" style="background:' + esc(g.data1) + '"></span><span class="hash">' + esc(g.data1) + '</span>&nbsp;· ' + esc(g.data2) : '<span class="muted">서명 의미를 선택하세요</span>'; } },
      { k: 'recType', label: '적용 레코드 타입', type: 'select', src: O.REC, req: true }, { k: 'auth', label: '요구 인증 강도', type: 'select', src: 'gcm:EBR_AUTH_STRENGTH', req: true },
      { k: 'batch', label: '일괄 서명', type: 'bool', text: '일괄 허용' }, { k: 'samePerson', label: '동일인 차단', type: 'bool', text: '수행자와 동일인 서명 차단' },
      /* get: master-t02 save()의 공통 필수 검사(일반 문구)를 건너뛰고 validate()의 UI-07 문구로 차단하기 위한 값 — checks 타입에서 get 은 필수 검사에만 쓰임 */
      { k: 'allowedRoles', label: '허용 역할', type: 'checks', src: ROLE_OPTS, req: true, get: function () { return 'ui07'; } },
      { k: 'note', label: '비고', type: 'textarea' }],
    blank: function () { return { id: 'SM-', ver: 1, meaning: '', recType: '', auth: '', batch: false, samePerson: true, allowedRoles: [], note: '' }; },
    validate: function (d) {
      var roleErr = validateAllowedRoles(d.allowedRoles); if (roleErr) return roleErr;

      if (d.recType === 'release' && d.batch) return '출하 승인은 개별 서명만 가능합니다 — 일괄 허용 불가.';
    },
    onChange: function (k, form) {
      if (k !== 'meaning') return;
      var g = MS.gRow('EBR_SIGN_MEANING', $('[data-f=meaning]', form).value);
      MT.form().data.meaning = g ? g.key1 : ''; MT.refreshDisplay();
      if (g && !$('[data-f=auth]', form).value) $('[data-f=auth]', form).value = g.data3;
    }
  };
  var AUTH = {

  function setSub(sub) {
    $$('#signTabs .tab').forEach(function (b) { b.classList.toggle('active', b.dataset.sub === sub); });

  }

  /* ---- viewport fit (catalog iframe + <1920 window) ---- */
  function fitShellToViewport() {
    var wrap = document.getElementById('shellScale');
    if (!wrap) return;
    var sw = 1920, sh = 1080;
    var w = window.innerWidth || sw;
    var h = window.innerHeight || sh;
    try {
      if (window.frameElement) {
        var fr = window.frameElement.getBoundingClientRect();
        if (fr.width > 40) w = fr.width;
        if (fr.height > 40) h = fr.height;
      }
    } catch (err) { /* cross-origin: keep innerWidth */ }
    if (window.visualViewport) {
      if (window.visualViewport.width > 40) w = Math.min(w, window.visualViewport.width);
      if (window.visualViewport.height > 40) h = Math.min(h, window.visualViewport.height);
    }
    var s = Math.min(w / sw, h / sh, 1);
    if (!(s > 0) || !isFinite(s)) s = 1;
    wrap.style.setProperty('--scale', String(s));
    wrap.style.width = (sw * s) + 'px';
    wrap.style.height = (sh * s) + 'px';
    document.body.classList.add('fit-host');
    document.documentElement.style.overflow = 'hidden';
    document.body.style.overflow = 'hidden';
  }
  window.addEventListener('resize', fitShellToViewport);
  window.addEventListener('load', fitShellToViewport);
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', fitShellToViewport);
  }
  fitShellToViewport();
  setTimeout(fitShellToViewport, 0);
  setTimeout(fitShellToViewport, 120);
</script>
